services:
  postgres:
    image: postgres:16-alpine
    container_name: abcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abcp_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-abcp}
      # Store and compare in UTC. The app pins its own session too
      # (config/database.ts) because an already-initialised data directory
      # keeps whatever TimeZone it was created with — which is how a
      # 7-hour-off raw-SQL comparison bug got in unnoticed.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - abcp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abcp} -d ${POSTGRES_DB:-abcp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: abcp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - abcp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  abcp_pgdata:
  abcp_redisdata:
